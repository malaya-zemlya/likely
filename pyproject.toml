[project]
name = "likely"
version = "0.1.0"
description = "Branch on plain-English yes/no questions, batched into TypeSafe System One calls"
readme = "README.md"
license = "MIT-0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/likely"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
